<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&family=Fredoka+One&family=Poppins:wght@400;700&family=Quicksand:wght@400;700&display=swap" rel="stylesheet">
     <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <title>Groupie Tracker</title>
    <link rel="stylesheet" href="/style/styleHome.css">
</head>
<body>
    <h1>🎸 Groupie Tracker 🎶</h1>
    <form class="search-bar" method="GET" action="/homepage">
        <input type="search" id="search-bar" name="query" value="{{.Query}}" pattern=".*\S.*" required>
        <button class="search-btn" type="submit">
            <span>Search</span>
        </button>
        <!-- <div class="suggestions" id="suggestions"></div> -->
    </form>

    <!-- fiters -->
    <button class="filter-btn" type="submit">
        <span>filter-btn</span>
    </button>
    <div class="filter" id="filter">
        <form method="GET" action="/homepage">
            <label for="min-date-range">Minimum Creation Date:</label>
            <input type="range" id="min-date-range" name="min-date" min="1950" max="2025" value="1950" step="1">
            <span id="min-date-value">1950</span>
            <script>
                const minDateRange = document.getElementById('min-date-range');
                const minDateValue = document.getElementById('min-date-value');
                
                minDateRange.addEventListener('input', function() {
                    minDateValue.textContent = this.value;
                });
                
                // Update initial value
                minDateValue.textContent = minDateRange.value;
            </script>
            <br />
            <label for="first-album">First Album:</label>
            <input type="text" id="first-album" name="first-album">
            
            <button type="submit">Apply</button>
        </form>
    </div>
    <!-- fiters /-->
     
    <div id="results"></div>
    <div class="container" id="artists">
        {{range .Artists}}
            <audio id="audio-{{.ID}}" prload="auto" loop>
                <source src="style/media/tracks/{{.ID}}.mp3" type="audio/mpeg">
                Your browser does not support the audio element.
            </audio>
            <div class="artist-cards" 
            onmouseenter="playTrack('{{.ID}}')"
            onmouseleave="stopTrack('{{.ID}}')">  
                <a href="artist-{{.ID}}">
                    <h2>{{.Name}}</h2>
                    <img src="{{.Image}}" alt="{{.Name}}" class="artist-image">
                </a>
            </div>

            <div class="overlay" id="artist-{{.ID}}">
            <div class="overlay-content">
                <a class="close-button">&times;</a>
                <h2>{{.Name}}</h2>
                <img src="{{.Image}}" alt="{{.Name}}" class="artist-image">
                <p id="headers">Members:</p>
                <ul>
                    {{range .Members}}
                        <a class="link" href="https://en.wikipedia.org/wiki/{{.}}"><p>{{.}}</p></a>
                    {{end}}
                </ul>
                <p id="headers">Creation Date:</p>
                <p>{{.CreationDate}}</p>
                <p id="headers">First Album:</p>
                <p>{{.FirstAlbum}}</p>
                <form action="/details" method="GET">
                    <input type="hidden" name="id" value="{{.ID}}">
                    <button>View More <i class="fas fa-external-link-alt"></i></button>
                </form>
            </div>
            </div>
        {{end}}
    </div>
    <script src="/style/script.js"></script>
</body>
</html>
