<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&family=Fredoka+One&family=Poppins:wght@400;700&family=Quicksand:wght@400;700&display=swap" rel="stylesheet">
     <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <title>Groupie Tracker</title>
    <link rel="stylesheet" href="/style/styleHome.css">
</head>
<body>
    <header class="main-header">
        <div class="header-left">
            <button class="filter-btn" id="filter-btn" onclick="showFilter()">Filters</button>
        </div>
        <div class="header-center">
            <button class="title-link">
                <a href="/homepage">
                    <h1 class="title">Groupie Tracker</h1>
                </a> 
            </button>
        </div>
        <div class="header-right">
            <form class="search-bar" method="GET" action="/homepage">
                <input type="search" class="search-input" id="search-bar" name="query" value="{{.Query}}" pattern=".*\S.*" required>
                <button class="search-btn" type="submit">
                    <span>Search</span>
                </button>
            </form>
        </div>
    </header>
    
    <div class="filter" id="filter">
        <form method="GET" action="/homepage">                       

            <label>Creation Date:</label>
            <input type="number" name="creationDateMin" id="creationDateMin" min="1958" max="2025" value="1958">
            <input type="number" name="creationDateMax" id="creationDateMax" min="1958" max="2025" value="2025">
            <br />
            <label>First Album Year:</label>
            <input type="number" name="firstAlbumDateMin" id="firstAlbumDateMin" min="1963" max="2025" value="1963">
            <input type="number" name="firstAlbumDateMax" id="firstAlbumDateMax" min="1963" max="2025" value="2025">

            <fieldset>
                <legend>Number of Members:</legend>
                <label><input type="checkbox" name="Member" value="1">1</label>
                <label><input type="checkbox" name="Member" value="2">2</label>
                <label><input type="checkbox" name="Member" value="3">3</label>
                <label><input type="checkbox" name="Member" value="4">4</label>
                <label><input type="checkbox" name="Member" value="5">5</label>
                <label><input type="checkbox" name="Member" value="6">6</label>
                <label><input type="checkbox" name="Member" value="7">7</label>
            </fieldset>
            locations of concerts:
            <input type="search" list="locations1" id="location" name="location" autocomplete="off">
            <datalist id="locations1">
                {{range .Artists}}
                    {{range .Locations}}
                        <option value="{{.Name}}">{{.Name}}</option>
                    {{end}}
                {{end}}
            </datalist>
            
            
            <button type="submit">Apply</button>
        </form>
    </div>
    
    <div id="results"></div>
    <div class="container" id="artists">
        {{range .Artists}}
            <audio id="audio-{{.ID}}" prload="auto" loop>
                <source src="style/media/tracks/{{.ID}}.mp3" type="audio/mpeg">
                Your browser does not support the audio element.
            </audio>
            <div class="artist-cards" 
            onmouseenter="playTrack('{{.ID}}')"
            onmouseleave="stopTrack('{{.ID}}')">  
                <a href="artist-{{.ID}}">
                    <h2>{{.Name}}</h2>
                    <img src="{{.Image}}" alt="{{.Name}}" class="artist-image">
                </a>
            </div>

            <div class="overlay" id="artist-{{.ID}}">
            <div class="overlay-content">
                <a class="close-button">&times;</a>
                <h2>{{.Name}}</h2>
                <img src="{{.Image}}" alt="{{.Name}}" class="artist-image">
                <p id="headers">Members:</p>
                <ul>
                    {{range .Members}}
                        <a class="link" href="https://en.wikipedia.org/wiki/{{.}}"><p class="link">{{.}}</p></a>
                    {{end}}
                </ul>
                <p id="headers">Creation Date:</p>
                <p class="details">{{.CreationDate}}</p>
                <p id="headers">First Album:</p>
                <p class="details">{{.FirstAlbum}}</p>
                <form action="/details" method="GET">
                    <input type="hidden" name="id" value="{{.ID}}">
                    <button>View More <i class="fas fa-external-link-alt"></i></button>
                </form>
            </div>
            </div>
        {{end}}
    </div>
    <script src="/style/script.js"></script>
</body>
</html>
