<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com"> 
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin> 
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://kit-pro.fontawesome.com/releases/v5.13.0/css/pro.min.css" rel="stylesheet"/>    
    <title>Groupie Tracker</title>
    <link rel="stylesheet" href="/style/styleWelcome.css">
    <link rel="stylesheet" href="/style/styleHome.css">
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const path = window.location.pathname;
            const el = document.querySelector('.main-footer');
        
            if (path === '/') {
            el.classList.add('welcome');
            }
        });
    </script>
</head>
<body>
    <div class="top">
        <div class="welcome">
            <div class="txt">Groupie Tracker</div>
        </div>
    </div>
    <div class="welcomeBox">
        <div class="buttons">
        <a href="/homepage">Start Here</a>
        </div>
    </div>
    {{ template "footer" . }}
</body>
</html>
